<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Options</title>
    <script defer src="options.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex justify-center items-center">
    <div class="w-96 bg-gray-800 p-6 rounded-lg shadow-lg">
        <h1 class="text-xl font-bold mb-4">Options</h1>
        <label class="block mb-4">
            <span class="text-gray-300">Language:</span>
            <select id="language" class="w-full p-2 rounded bg-gray-700 text-white">
                <option value="en">English</option>
                <option value="pt">Português</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
            </select>
        </label>
        <button id="save" class="w-full bg-blue-600 hover:bg-blue-500 text-white p-2 rounded">Save</button>
    </div>
</body>
</html>
