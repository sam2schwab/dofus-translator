<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Options</title>
    <script type="module" src="./options.ts"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex justify-center items-center">
    <div class="w-96 bg-gray-800 p-6 rounded-lg shadow-lg">
        <div class="flex items-center mb-4">
            <img src="../icons/icon48.png" alt="Extension Icon" class="w-8 h-8 mr-2">
            <h1 class="text-xl font-bold">Dofus Translator Options</h1>
        </div>
        <label class="block mb-4">
            <span class="text-gray-300 mb-1 inline-block">Translation Language:</span>
            <select id="language" class="w-full p-2 rounded bg-gray-700 text-white border-r-8 border-gray-700">
                <option value="en">English</option>
                <option value="pt">Português</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
            </select>
        </label>
        <button id="save" class="w-full bg-blue-600 hover:bg-blue-500 text-white p-2 rounded font-bold">Save</button>
    </div>
    <footer class="text-center text-gray-500 text-sm mt-6 absolute bottom-4 w-full">
        <a href="https://www.buymeacoffee.com/isthos" 
           target="_blank" 
           class="hover:underline">
           Enjoying the extension? Support it! 📖
        </a>
    </footer>
</body>
</html>
